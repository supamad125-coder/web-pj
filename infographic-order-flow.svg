<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1080 2360" role="img" aria-labelledby="title desc">
  <title id="title">อินโฟกราฟิกระบบสั่งอาหาร หม้อไฟแดนนรก</title>
  <desc id="desc">ขั้นตอนการยืนยันรหัส เลือกแพ็กเกจ โต๊ะ เมนู และข้อจำกัดของเว็บตัวอย่าง</desc>
  <defs>
    <linearGradient id="hero" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#7f1111"/><stop offset=".58" stop-color="#c2261e"/><stop offset="1" stop-color="#ef6a25"/></linearGradient>
    <linearGradient id="flame" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#ffd258"/><stop offset="1" stop-color="#ff7a24"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4b1b12" flood-opacity=".09"/></filter>
    <style>
      text{font-family:"Noto Sans Thai","Tahoma",sans-serif;fill:#302520}
      .white{fill:#fff}.muted{fill:#80736b}.tiny{font-size:20px}.small{font-size:23px}.body{font-size:25px}.heading{font-size:31px;font-weight:700}.step-title{font-size:29px;font-weight:700}.num{font-size:27px;font-weight:700;fill:#fff}.chip{font-size:21px;font-weight:600}
    </style>
  </defs>
  <rect width="1080" height="2360" fill="#fbf5ec"/>
  <path d="M0 0h1080v330c-192 85-367 40-537 10C351 310 173 393 0 330Z" fill="url(#hero)"/>
  <circle cx="960" cy="70" r="145" fill="#ffffff" opacity=".06"/><circle cx="1010" cy="250" r="90" fill="#ffffff" opacity=".05"/>
  <g transform="translate(72 62)">
    <circle cx="44" cy="44" r="42" fill="#ffdf9a"/>
    <path d="M22 44h44l-5 25H27z" fill="#8b1916" stroke="#4b1813" stroke-width="4" stroke-linejoin="round"/>
    <path d="M30 39c-8-11 6-14 1-23m16 23c-8-11 6-14 1-23m15 23c-8-11 6-14 1-23" fill="none" stroke="url(#flame)" stroke-width="5" stroke-linecap="round"/>
  </g>
  <text x="174" y="91" class="white" font-size="27" font-weight="600">หม้อไฟแดนนรก</text>
  <text x="174" y="126" fill="#ffe8c8" font-size="20">ภาพรวมระบบสั่งชาบูออนไลน์</text>
  <text x="72" y="227" class="white" font-size="61" font-weight="800">สั่งชาบูง่าย ๆ</text>
  <text x="72" y="296" fill="#ffe7bd" font-size="48" font-weight="700">ใน 6 ขั้นตอน</text>
  <text x="74" y="345" fill="#fff2df" font-size="22">จากรหัสยืนยันไปจนถึงตรวจสอบรายการ</text>

  <rect x="48" y="390" width="984" height="1150" rx="30" fill="#fff" filter="url(#shadow)"/>
  <text x="86" y="455" class="heading">เส้นทางของผู้ใช้</text>
  <text x="86" y="492" class="small muted">เลือกตามลำดับ แล้วตรวจรายการก่อนยืนยัน</text>
  <path d="M137 558v818" stroke="#f0c5a4" stroke-width="5" stroke-linecap="round" stroke-dasharray="5 13"/>

  <g filter="url(#shadow)">
    <rect x="82" y="525" width="916" height="145" rx="22" fill="#fffaf4" stroke="#f1e5d8"/>
    <circle cx="137" cy="597" r="33" fill="#a81d1a"/><text x="137" y="606" text-anchor="middle" class="num">1</text>
    <text x="194" y="582" class="step-title">ยืนยันรหัส 6 หลัก</text><text x="194" y="622" class="small muted">ระบบสุ่มรหัสและแสดงบนหน้าเว็บ · ไม่มี SMS หรืออีเมล</text>

    <rect x="82" y="688" width="916" height="130" rx="22" fill="#fff" stroke="#f1e5d8"/>
    <circle cx="137" cy="753" r="33" fill="#b3261e"/><text x="137" y="762" text-anchor="middle" class="num">2</text>
    <text x="194" y="746" class="step-title">เข้าสู่หน้าหลัก</text><text x="194" y="785" class="small muted">ดูภาพรวมระบบ แล้วเริ่มสั่งอาหาร</text>

    <rect x="82" y="836" width="916" height="165" rx="22" fill="#fffaf4" stroke="#f1e5d8"/>
    <circle cx="137" cy="918" r="33" fill="#c6371e"/><text x="137" y="927" text-anchor="middle" class="num">3</text>
    <text x="194" y="884" class="step-title">เลือกแพ็กเกจ</text><text x="194" y="922" class="small muted">มี 3 ชุด ราคาเริ่มต้น 109 บาท</text>
    <rect x="194" y="944" width="146" height="39" rx="19" fill="#fbe9d5"/><text x="267" y="971" text-anchor="middle" class="chip">109 บาท</text>
    <rect x="352" y="944" width="146" height="39" rx="19" fill="#fbe9d5"/><text x="425" y="971" text-anchor="middle" class="chip">219 บาท</text>
    <rect x="510" y="944" width="146" height="39" rx="19" fill="#fbe9d5"/><text x="583" y="971" text-anchor="middle" class="chip">299 บาท</text>

    <rect x="82" y="1019" width="916" height="145" rx="22" fill="#fff" stroke="#f1e5d8"/>
    <circle cx="137" cy="1091" r="33" fill="#d64a1d"/><text x="137" y="1100" text-anchor="middle" class="num">4</text>
    <text x="194" y="1077" class="step-title">เลือกโต๊ะ</text><text x="194" y="1118" class="small muted">มี 12 โต๊ะ · T04 และ T09 ไม่ว่าง</text>

    <rect x="82" y="1182" width="916" height="145" rx="22" fill="#fffaf4" stroke="#f1e5d8"/>
    <circle cx="137" cy="1254" r="33" fill="#df581e"/><text x="137" y="1263" text-anchor="middle" class="num">5</text>
    <text x="194" y="1240" class="step-title">เลือกเมนู</text><text x="194" y="1281" class="small muted">8 หมวด · 97 รายการ · เมนูรวมในแพ็กเกจ</text>

    <rect x="82" y="1345" width="916" height="145" rx="22" fill="#fff" stroke="#f1e5d8"/>
    <circle cx="137" cy="1417" r="33" fill="#ed6d22"/><text x="137" y="1426" text-anchor="middle" class="num">6</text>
    <text x="194" y="1403" class="step-title">ตรวจและยืนยันออเดอร์</text><text x="194" y="1444" class="small muted">แสดงเลขออเดอร์และเวลารอจำลอง 10–25 นาที</text>
  </g>

  <text x="62" y="1610" class="heading">ข้อมูลสำคัญที่ควรรู้</text>
  <g filter="url(#shadow)">
    <rect x="52" y="1650" width="474" height="300" rx="26" fill="#fff"/>
    <circle cx="104" cy="1710" r="25" fill="#fff0d9"/><path d="M95 1708h18v17H95zm-3-8h24v8H92z" fill="none" stroke="#bb5422" stroke-width="3" stroke-linejoin="round"/>
    <text x="145" y="1719" class="heading">ข้อมูลอยู่ที่ไหน?</text>
    <text x="84" y="1780" class="body">การเลือกโต๊ะ แพ็กเกจ และเมนู</text><text x="84" y="1818" class="body">บันทึกไว้ในเบราว์เซอร์เครื่องนี้</text>
    <text x="84" y="1870" class="small muted">รหัสยืนยันเก็บชั่วคราวในเซสชัน</text>

    <rect x="554" y="1650" width="474" height="300" rx="26" fill="#fff3e8"/>
    <circle cx="606" cy="1710" r="25" fill="#ffe0c2"/><path d="M606 1695l16 29h-32z" fill="none" stroke="#a52b1a" stroke-width="3" stroke-linejoin="round"/><path d="M606 1704v9m0 5v1" stroke="#a52b1a" stroke-width="3" stroke-linecap="round"/>
    <text x="647" y="1719" class="heading">ข้อจำกัดของระบบ</text>
    <text x="586" y="1780" class="body">เป็นเว็บตัวอย่าง ยังไม่มีฐานข้อมูล</text><text x="586" y="1818" class="body">ไม่มีชำระเงินจริงหรือส่งออเดอร์</text><text x="586" y="1856" class="body">เข้าร้านจริง</text>
    <text x="586" y="1904" class="tiny muted">รหัสแสดงบนเว็บ จึงไม่ใช่การยืนยันตัวตนจริง</text>
  </g>
  <rect x="52" y="1984" width="976" height="174" rx="26" fill="#3a211b"/>
  <text x="88" y="2041" fill="#ffd18e" font-size="27" font-weight="700">เส้นทางแนะนำ กับสิ่งที่ระบบบังคับ</text>
  <text x="88" y="2090" class="white" font-size="23">ต้องยืนยันรหัสก่อนเข้าหน้าอื่น ส่วนแพ็กเกจ → โต๊ะ → เมนู</text>
  <text x="88" y="2128" class="white" font-size="23">เป็นลำดับแนะนำ แต่สามารถเปิดหน้าเหล่านั้นโดยตรงได้</text>
  <text x="540" y="2240" text-anchor="middle" class="small muted">หม้อไฟแดนนรก · อินโฟกราฟิกภาพรวมเว็บไซต์</text>
  <text x="540" y="2280" text-anchor="middle" class="tiny muted">ราคาและสถานะโต๊ะเป็นข้อมูลตัวอย่างในระบบ</text>
</svg>
