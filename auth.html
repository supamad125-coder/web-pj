<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>ยืนยันตัวตน | หม้อไฟแดนนรก</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/css/style.css" rel="stylesheet">
</head>

<body>
    <div id="appHeader"></div>
    <main class="container py-4 py-lg-5 auth-main">
        <div class="page-heading"><span class="section-kicker">ยืนยันตัวตน</span>
            <h1>กรอกรหัส 6 หลัก</h1>
            <p>ยืนยันก่อนส่งออเดอร์ของคุณ รหัสนี้ใช้สำหรับการสาธิตบนอุปกรณ์นี้</p>
        </div>
        <section class="panel auth-panel">
            <div class="auth-lock" aria-hidden="true">✓</div>
            <h2>รหัสยืนยันของคุณ</h2>
            <p class="auth-hint">กดขอรหัสเพื่อสุ่มรหัสยืนยันใหม่</p>
            <div class="auth-code-box" id="authCodeBox" aria-live="polite">กดขอรหัสยืนยัน</div>
            <button class="btn btn-order auth-send" id="generateCode" type="button">ขอรหัสยืนยัน</button>
            <form id="authForm" class="auth-form">
                <label for="authCode">รหัสยืนยัน 6 หลัก</label>
                <input id="authCode" name="authCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="กรอกรหัสที่ได้รับ" required>
                <p class="auth-message" id="authMessage" aria-live="polite"></p>
                <button class="btn btn-order" type="submit">ยืนยันรหัส →</button>
            </form>
        </section>
        <aside class="demo-banner">ระบบตัวอย่าง: รหัสจะแสดงบนหน้านี้ ไม่มีการส่ง SMS หรืออีเมล</aside>
    </main>
    <div id="appFooter"></div>
    <script src="assets/js/app.js"></script>
</body>

</html>
